name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Install the Aztec toolchain (6.0.0, includes aztec-forge)
        run: |
          curl -fsSL https://install.aztec.network | bash
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/current/bin" >> "$GITHUB_PATH"
      - name: Pin aztec 6.0.0
        run: aztec-up install 6.0.0

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Build (noir compile + codegen + forge build + tsc)
        run: yarn build

      - name: L1 unit tests (Foundry)
        run: yarn test:l1

      - name: SDK unit tests
        run: yarn test:sdk

      - name: Aztec TXE unit tests
        run: yarn test:aztec-unit

# Intentionally NOT run in CI:
#   - yarn test:aztec / yarn test:e2e  -> require `aztec start --local-network` (heavyweight); run locally.
#   - yarn prover:install / test:fork  -> the isolated legacy Tornado prover + a mainnet fork and the
#                                         local network. Operator-run only. See SECURITY.md.
